name: orbit-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: orbit-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-orbit-local-dev-secret-change-me}"
    volumes:
      - ./searxng:/etc/searxng:Z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/search?q=orbit&format=json' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
