name: orbit-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: orbit-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-orbit-local-dev-secret}"
    volumes:
      - ./searxng:/etc/searxng:Z
